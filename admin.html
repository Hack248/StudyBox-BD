<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>StudyBox BD - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#222;
}

header{
background:#111827;
color:white;
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:20px;
font-weight:bold;
}

.logout{
background:#ef4444;
color:white;
border:0;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

.container{
max-width:1100px;
margin:auto;
padding:25px 18px;
}

h1{
margin-bottom:8px;
}

.subtitle{
color:#666;
margin-bottom:25px;
}

.card{
background:white;
padding:22px;
border-radius:14px;
margin-bottom:20px;
box-shadow:0 3px 12px rgba(0,0,0,.07);
}

input,
textarea{
width:100%;
padding:12px;
margin-top:7px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
min-height:100px;
resize:vertical;
}

button{
background:#2563eb;
color:white;
border:0;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

button:hover{
opacity:.9;
}

#message{
margin-top:15px;
font-weight:bold;
}

.material{
border:1px solid #eee;
padding:15px;
border-radius:10px;
margin-top:12px;
}

.material h3{
margin-bottom:8px;
}

.delete{
background:#dc2626;
margin-top:10px;
}

.back{
color:white;
text-decoration:none;
margin-right:15px;
}

</style>

</head>


<body>


<header>

<div class="logo">
🛡️ StudyBox BD Admin
</div>

<div>

<a
href="dashboard.html"
class="back">
Dashboard
</a>

<button
class="logout"
onclick="logout()">
Logout
</button>

</div>

</header>


<div class="container">

<h1>Admin Panel</h1>

<p class="subtitle">
StudyBox BD পরিচালনা করুন।
</p>


<!-- ADD MATERIAL -->

<div class="card">

<h2>➕ নতুন Study Material</h2>

<br>

<label>
Title
</label>

<input
id="title"
type="text"
placeholder="যেমন: SSC গণিত অধ্যায় ১">


<label>
Description
</label>

<textarea
id="description"
placeholder="Material সম্পর্কে সংক্ষিপ্ত তথ্য">
</textarea>


<label>
Subject
</label>

<input
id="subject"
type="text"
placeholder="যেমন: গণিত">


<label>
Class
</label>

<input
id="className"
type="text"
placeholder="যেমন: SSC / Class 10">


<label>
Material URL
</label>

<input
id="contentUrl"
type="url"
placeholder="PDF বা অন্য Material-এর URL">


<button
onclick="addMaterial()">
Material যোগ করুন
</button>


<div id="message"></div>

</div>


<!-- MATERIAL LIST -->

<div class="card">

<h2>📚 Existing Materials</h2>

<div id="materials">
Loading...
</div>

</div>


</div>


<script>


const SUPABASE_URL =
"https://hack248.github.io/StudyBox-BD/URL";

const SUPABASE_ANON_KEY =
"https://hack248.github.io/StudyBox-BD/KEY";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


// Check Admin

async function checkAdmin(){

const {
data:{
user
}
} =
await supabaseClient.auth.getUser();


if(!user){

window.location.href =
"auth.html";

return;

}


const {
data:profile,
error
} =
await supabaseClient
.from("profiles")
.select("is_admin")
.eq("id",user.id)
.single();


if(error ||
!profile ||
profile.is_admin !== true){

alert(
"আপনার Admin access নেই।"
);

window.location.href =
"dashboard.html";

return;

}


loadMaterials();

}


// Add Material

async function addMaterial(){

const title =
document.getElementById("title").value.trim();

const description =
document.getElementById("description").value.trim();

const subject =
document.getElementById("subject").value.trim();

const className =
document.getElementById("className").value.trim();

const contentUrl =
document.getElementById("contentUrl").value.trim();


if(!title){

document.getElementById("message").innerText =
"Title লিখুন।";

return;

}


const {
data:{
user
}
} =
await supabaseClient.auth.getUser();


const {
error
} =
await supabaseClient
.from("study_materials")
.insert({

title:title,

description:description,

subject:subject,

class_name:className,

content_url:contentUrl,

created_by:user.id

});


if(error){

document.getElementById("message").innerText =
"Material যোগ করা যায়নি।";

return;

}


document.getElementById("message").innerText =
"✅ Material সফলভাবে যোগ হয়েছে।";


document.getElementById("title").value = "";

document.getElementById("description").value = "";

document.getElementById("subject").value = "";

document.getElementById("className").value = "";

document.getElementById("contentUrl").value = "";


loadMaterials();

}


// Load Materials

async function loadMaterials(){

const {
data,
error
} =
await supabaseClient
.from("study_materials")
.select("*")
.order("created_at",{ascending:false});


const container =
document.getElementById("materials");


if(error){

container.innerText =
"Materials load করা যায়নি।";

return;

}


if(!data || data.length === 0){

container.innerText =
"এখনো কোনো material নেই।";

return;

}


container.innerHTML = "";


data.forEach(material => {

const div =
document.createElement("div");

div.className =
"material";


div.innerHTML = `

<h3>
${escapeHTML(material.title)}
</h3>

<p>
📚 ${escapeHTML(material.subject || "N/A")}
</p>

<p>
🎓 ${escapeHTML(material.class_name || "N/A")}
</p>

<p>
${escapeHTML(material.description || "")}
</p>

${
material.content_url
?
`<a
href="${escapeAttribute(material.content_url)}"
target="_blank"
rel="noopener">
Material খুলুন
</a>`
:
""
}

<br>

<button
class="delete"
onclick="deleteMaterial(${material.id})">
Delete
</button>

`;


container.appendChild(div);

});

}


// Delete

async function deleteMaterial(id){

const confirmed =
confirm(
"এই material delete করতে চান?"
);


if(!confirmed){
return;
}


const {
error
} =
await supabaseClient
.from("study_materials")
.delete()
.eq("id",id);


if(error){

alert(
"Delete করা যায়নি।"
);

return;

}


loadMaterials();

}


// Logout

async function logout(){

await supabaseClient.auth.signOut();

window.location.href =
"auth.html";

}


// Security helpers

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return String(value)
.replace(/"/g,"%22")
.replace(/</g,"%3C")
.replace(/>/g,"%3E");

}


checkAdmin();

</script>


</body>

</html>
