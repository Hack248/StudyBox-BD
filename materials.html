<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>StudyBox BD - Materials</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#222;
}

header{
background:white;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
font-size:20px;
font-weight:bold;
}

.back{
text-decoration:none;
color:#2563eb;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

h1{
margin-bottom:10px;
}

.subtitle{
color:#666;
margin-bottom:25px;
}

#materials{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:18px;
}

.card{
background:white;
padding:22px;
border-radius:14px;
box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.card h2{
font-size:19px;
margin-bottom:10px;
}

.info{
color:#666;
font-size:14px;
margin-bottom:10px;
}

.card a{
display:inline-block;
margin-top:10px;
color:#2563eb;
text-decoration:none;
font-weight:bold;
}

.empty{
background:white;
padding:25px;
border-radius:14px;
color:#666;
}

</style>

</head>

<body>

<header>

<div class="logo">
📚 StudyBox BD
</div>

<a
href="dashboard.html"
class="back">
Dashboard
</a>

</header>


<div class="container">

<h1>📚 Study Materials</h1>

<p class="subtitle">
তোমার পড়াশোনার materials এখানে থাকবে।
</p>

<div id="materials">

<div class="empty">
Materials loading...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://hack248.github.io/StudyBox-BD/URL";

const SUPABASE_ANON_KEY =
"https://hack248.github.io/StudyBox-BD/KEY";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


async function loadMaterials(){

const {
data,
error
} =
await supabaseClient
.from("study_materials")
.select("*")
.order("created_at",{ascending:false});


const container =
document.getElementById("materials");


if(error){

container.innerHTML =
`<div class="empty">
Materials load করা যায়নি।
</div>`;

return;

}


if(!data || data.length === 0){

container.innerHTML =
`<div class="empty">
এখনো কোনো Study Material যোগ করা হয়নি।
</div>`;

return;

}


container.innerHTML = "";


data.forEach(material => {

const card =
document.createElement("div");

card.className = "card";


card.innerHTML = `

<h2>
${escapeHTML(material.title)}
</h2>

<div class="info">
📚 Subject:
${escapeHTML(material.subject || "N/A")}
</div>

<div class="info">
🎓 Class:
${escapeHTML(material.class_name || "N/A")}
</div>

<p>
${escapeHTML(material.description || "")}
</p>

${
material.content_url
?
`<a
href="${escapeAttribute(material.content_url)}"
target="_blank"
rel="noopener">
Material খুলুন →
</a>`
:
""
}

`;


container.appendChild(card);

});

}


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return String(value)
.replace(/"/g,"%22")
.replace(/</g,"%3C")
.replace(/>/g,"%3E");

}


loadMaterials();

</script>

</body>

  </html>
