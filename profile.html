<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyBox BD - My Profile</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #2563eb;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
        }

        h1 {
            margin-bottom: 25px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9dce3;
            border-radius: 9px;
            font-size: 15px;
        }

        input:disabled {
            background: #f1f3f5;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 8px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        📚 StudyBox BD
    </div>

    <a href="dashboard.html" class="back">
        Dashboard
    </a>

</header>


<div class="container">

    <div class="box">

        <h1>👤 My Profile</h1>

        <div class="profile-icon">
            👤
        </div>


        <label>Name</label>

        <input
            type="text"
            id="name"
            placeholder="তোমার নাম"
        >


        <label>Email</label>

        <input
            type="email"
            id="email"
            disabled
        >


        <button onclick="saveProfile()">
            Save Profile
        </button>


        <div
            id="message"
            class="message">
        </div>

    </div>

</div>


<script>

    const SUPABASE_URL =
        "https://hack248.github.io/StudyBox-BD/URL";

    const SUPABASE_ANON_KEY =
        "https://hack248.github.io/StudyBox-BD/KEY";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    let currentUser = null;


    function showMessage(text) {

        const message =
            document.getElementById("message");

        message.style.display = "block";

        message.textContent = text;
    }


    async function loadProfile() {

        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();


        if (!user) {

            window.location.href =
                "auth.html";

            return;
        }


        currentUser = user;


        document.getElementById("email")
            .value = user.email;


        const {
            data: profile
        } = await supabaseClient
            .from("profiles")
            .select("full_name")
            .eq("id", user.id)
            .single();


        if (profile) {

            document.getElementById("name")
                .value =
                profile.full_name || "";
        }
    }


    async function saveProfile() {

        if (!currentUser) {
            return;
        }


        const name =
            document.getElementById("name")
            .value
            .trim();


        if (!name) {

            showMessage(
                "নাম লিখো।"
            );

            return;
        }


        const {
            error
        } = await supabaseClient
            .from("profiles")
            .update({
                full_name: name
            })
            .eq("id", currentUser.id);


        if (error) {

            showMessage(
                "Profile save করা যায়নি: " +
                error.message
            );

            return;
        }


        showMessage(
            "Profile সফলভাবে আপডেট হয়েছে।"
        );
    }


    loadProfile();

</script>

</body>
      </html>
