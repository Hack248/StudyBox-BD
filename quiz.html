<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>StudyBox BD - Quiz</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#222;
}

header{
background:white;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
font-size:20px;
font-weight:bold;
}

.back{
color:#2563eb;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:25px 18px;
}

.card{
background:white;
padding:22px;
border-radius:14px;
margin-bottom:20px;
box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.quiz{
border:1px solid #eee;
padding:18px;
border-radius:12px;
margin-top:15px;
}

.quiz h2{
margin-bottom:10px;
}

.start{
display:inline-block;
margin-top:15px;
background:#2563eb;
color:white;
padding:11px 17px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

.empty{
padding:25px;
background:white;
border-radius:12px;
color:#666;
}

</style>

</head>


<body>


<header>

<div class="logo">
📝 StudyBox BD Quiz
</div>

<a
href="dashboard.html"
class="back">
Dashboard
</a>

</header>


<div class="container">

<div class="card">

<h1>📝 Online Quiz</h1>

<p style="margin-top:8px;color:#666;">
নিজের জ্ঞান যাচাই করো।
</p>

<div id="quizList">

Loading...

</div>

</div>

</div>


<script>


const SUPABASE_URL =
"https://hack248.github.io/StudyBox-BD/URL";

const SUPABASE_ANON_KEY =
"https://hack248.github.io/StudyBox-BD/KEY";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


async function loadQuizzes(){

const container =
document.getElementById("quizList");


const {
data,
error
} =
await supabaseClient
.from("quizzes")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

container.innerHTML =
`
<div class="empty">
❌ Quiz load করা যায়নি।
</div>
`;

return;

}


if(!data || data.length === 0){

container.innerHTML =
`
<div class="empty">
এখনো কোনো Quiz প্রকাশ করা হয়নি।
</div>
`;

return;

}


container.innerHTML = "";


data.forEach(quiz => {

const div =
document.createElement("div");

div.className =
"quiz";


div.innerHTML = `

<h2>
📝 ${escapeHTML(quiz.title)}
</h2>

<p>
📚 Subject:
${escapeHTML(quiz.subject || "N/A")}
</p>

<p>
🎓 Class:
${escapeHTML(quiz.class_name || "N/A")}
</p>

<p style="margin-top:10px;">
${escapeHTML(quiz.description || "")}
</p>

<a
class="start"
href="take-quiz.html?id=${quiz.id}">
Quiz শুরু করুন →
</a>

`;

container.appendChild(div);

});

}


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


loadQuizzes();

</script>


</body>

</html>
