<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyBox BD - Reset Password</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px 24px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9dce3;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #f1f5f9;
            line-height: 1.5;
            display: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🔐 Reset Password</h1>

    <p class="subtitle">
        তোমার নতুন Password তৈরি করো।
    </p>

    <label>নতুন Password</label>

    <input
        type="password"
        id="newPassword"
        placeholder="নতুন Password"
    >

    <label>Password আবার লিখো</label>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Password আবার লিখো"
    >

    <button onclick="updatePassword()">
        নতুন Password Save করুন
    </button>

    <div id="message" class="message"></div>

    <a href="auth.html" class="back">
        ← Login Page
    </a>

</div>


<script>

    const SUPABASE_URL =
        "https://hack248.github.io/StudyBox-BD/URL";

    const SUPABASE_ANON_KEY =
        "https://hack248.github.io/StudyBox-BD/KEY";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    function showMessage(text) {

        const message =
            document.getElementById("message");

        message.style.display = "block";

        message.textContent = text;
    }


    async function updatePassword() {

        const password =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (!password || !confirmPassword) {

            showMessage(
                "দুইটি ঘরই পূরণ করো।"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password কমপক্ষে ৬ অক্ষরের হতে হবে।"
            );

            return;
        }


        if (password !== confirmPassword) {

            showMessage(
                "দুইটি Password একই নয়।"
            );

            return;
        }


        const {
            error
        } = await supabaseClient.auth.updateUser({

            password: password

        });


        if (error) {

            showMessage(
                "Password পরিবর্তন করা যায়নি: " +
                error.message
            );

            return;
        }


        showMessage(
            "Password সফলভাবে পরিবর্তন হয়েছে। এখন Login করতে পারো।"
        );


        setTimeout(() => {

            window.location.href =
                "auth.html";

        }, 1800);
    }

</script>

</body>
</html>
