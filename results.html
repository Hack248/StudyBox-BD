<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>StudyBox BD - My Results</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#222;
}

header{
background:white;
padding:16px 20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
font-size:20px;
font-weight:bold;
}

.back{
color:#2563eb;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:25px 18px;
}

.card{
background:white;
padding:22px;
border-radius:14px;
margin-bottom:18px;
box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.result-card{
border:1px solid #eee;
padding:18px;
border-radius:10px;
margin-top:15px;
}

.score{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.date{
color:#666;
font-size:14px;
margin-top:8px;
}

.empty{
color:#666;
padding:20px 0;
}

</style>

</head>

<body>

<header>

<div class="logo">
📊 StudyBox BD
</div>

<a
href="dashboard.html"
class="back">
Dashboard
</a>

</header>


<div class="container">

<div class="card">

<h1>📊 My Results</h1>

<p
style="margin-top:8px;color:#666;">
তোমার Quiz-এর আগের ফলাফলগুলো এখানে থাকবে।
</p>

<div id="results">
Loading...
</div>

</div>

</div>


<script>


const SUPABASE_URL =
"https://hack248.github.io/StudyBox-BD/URL";

const SUPABASE_ANON_KEY =
"https://hack248.github.io/StudyBox-BD/KEY";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


async function loadResults(){

const {
data:{
user
}
} =
await supabaseClient.auth.getUser();


if(!user){

window.location.href =
"auth.html";

return;

}


const {
data,
error
} =
await supabaseClient
.from("quiz_attempts")
.select(`
    id,
    score,
    total_questions,
    completed_at,
    quizzes (
        title,
        subject,
        class_name
    )
`)
.eq("user_id",user.id)
.order(
"completed_at",
{
ascending:false
}
);


const container =
document.getElementById("results");


if(error){

console.error(error);

container.innerHTML = `
<div class="empty">
❌ Results load করা যায়নি।
</div>
`;

return;

}


if(!data || data.length === 0){

container.innerHTML = `
<div class="empty">
এখনো কোনো Quiz Result নেই।
</div>
`;

return;

}


container.innerHTML = "";


data.forEach(result => {

const quiz =
result.quizzes;


const percentage =
result.total_questions > 0
?
Math.round(
(result.score /
result.total_questions) * 100
)
:
0;


const date =
new Date(
result.completed_at
).toLocaleString(
"bn-BD"
);


const div =
document.createElement("div");


div.className =
"result-card";


div.innerHTML = `

<h2>
📝 ${escapeHTML(
quiz?.title || "Quiz"
)}
</h2>

<p style="margin-top:8px;">
📚 Subject:
${escapeHTML(
quiz?.subject || "N/A"
)}
</p>

<p style="margin-top:5px;">
🎓 Class:
${escapeHTML(
quiz?.class_name || "N/A"
)}
</p>

<div class="score">
🏆 Score:
${result.score}
/
${result.total_questions}
(${percentage}%)
</div>

<div class="date">
🕒 ${escapeHTML(date)}
</div>

`;

container.appendChild(div);

});

}


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


loadResults();

</script>

</body>

                                                                     </html>
